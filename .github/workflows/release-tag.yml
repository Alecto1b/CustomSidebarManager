name: Release Tag

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: PHP Lint
        run: |
          php -l index.php
          find src -name "*.php" -exec php -l {} \;

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: Build release archive
        run: |
          mkdir -p release/CustomSidebarManager
          rsync -av --progress ./ release/CustomSidebarManager/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'tests' \
            --exclude 'dist' \
            --exclude 'release' \
            --exclude 'archives'
          cd release
          zip -r plugin.zip CustomSidebarManager

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/plugin.zip
